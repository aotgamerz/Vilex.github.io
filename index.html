<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vilex — Server Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="frontend/main/css/style.css">
</head>
<body>

<main class="wrap">

  <header class="top">
    <div class="logo"><span class="logo-mark"></span>Vilex</div>
    <div class="status-pill">
      <span class="status-dot"></span>
      <span id="status-text">Online</span>
    </div>
  </header>

  <section class="hero">
    <h1>My Minecraft world<br>is <span class="accent">up right now.</span></h1>
    <p class="sub">Whitelisted survival server. Join with the address below.</p>

    <div class="ip-row">
      <code id="server-ip" class="ip">play.vilex.net</code>
      <button class="copy-btn" onclick="copyIp()">Copy</button>
    </div>
  </section>

  <section class="stats">
    <div class="stat-card">
      <div class="stat-label">Players online</div>
      <div class="stat-value"><span id="players-now">3</span><span class="stat-max">/20</span></div>
      <ul class="player-list" id="player-list">
        <li>Steve_Lex</li>
        <li>notch_fan22</li>
        <li>bee_keeper</li>
      </ul>
    </div>

    <div class="stat-card">
      <div class="stat-label">Uptime</div>
      <div class="stat-value">99.8<span class="stat-max">%</span></div>
      <div class="stat-note">last 30 days</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Version</div>
      <div class="stat-value stat-value--small">Paper 1.21.4</div>
      <div class="stat-note">last restart: 2 days ago</div>
    </div>
  </section>

  <footer class="foot">
    <span>Vilex — private server</span>
  </footer>

</main>

<script>
  function copyIp(){
    const ip = document.getElementById('server-ip').innerText;
    navigator.clipboard.writeText(ip);
    const btn = document.querySelector('.copy-btn');
    const original = btn.innerText;
    btn.innerText = 'Copied';
    setTimeout(() => btn.innerText = original, 1200);
  }
</script>

</body>
</html>
